[project]
name = "qwen-web-research-mcp"
version = "0.1.0"
description = "MCP server: web scraping + search filtered by phrase, analyzed with a local Qwen model via Ollama"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "ddgs>=9.0",
]

[project.scripts]
qwen-web-research-mcp = "qwen_web_research.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_web_research"]
